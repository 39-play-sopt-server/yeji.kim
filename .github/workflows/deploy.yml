name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JAR
        run: bash ./gradlew clean bootJar --no-daemon

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          printf '%s %s\n' "$EC2_HOST" "$EC2_HOST_KEY" > ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host assignment-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload JAR
        run: |
          scp build/libs/assignment-1.0-SNAPSHOT.jar \
            assignment-ec2:/home/ubuntu/assignment-next.jar

      - name: Deploy and check startup
        run: |
          ssh assignment-ec2 'bash -se' <<'EOF'
          APP_DIR=/home/ubuntu/yeji.kim/build/libs
          JAR=assignment-1.0-SNAPSHOT.jar

          test -s /home/ubuntu/assignment-next.jar
          mkdir -p "$APP_DIR"
          cp "$APP_DIR/$JAR" "$APP_DIR/$JAR.previous"
          sudo -n systemctl stop assignment
          mv /home/ubuntu/assignment-next.jar "$APP_DIR/$JAR"
          sudo -n systemctl start assignment

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 5 \
              http://127.0.0.1:8080/v3/api-docs > /dev/null; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 3
          done

          echo "Startup failed; restoring previous JAR"
          sudo -n journalctl -u assignment -n 50 --no-pager
          sudo -n systemctl stop assignment
          mv "$APP_DIR/$JAR.previous" "$APP_DIR/$JAR"
          sudo -n systemctl start assignment
          exit 1
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key