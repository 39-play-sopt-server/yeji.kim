services:
  app:
    image: "${APP_IMAGE:?APP_IMAGE_REQUIRED}"
    restart: unless-stopped
    env_file:
      - /etc/assignment/assignment.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://assignment.cfeawekuyw0i.ap-northeast-2.rds.amazonaws.com:3306/assignment
      SPRING_DATASOURCE_USERNAME: yeji
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "8080"

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro