app:
  cors:
    allowed-origins:
      - "http://localhost:5173"

spring:
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: assignment

  datasource:
    url: jdbc:mysql://assignment.cfeawekuyw0i.ap-northeast-2.rds.amazonaws.com:3306/assignment
    username: yeji
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000